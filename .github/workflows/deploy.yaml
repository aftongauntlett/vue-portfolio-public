name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Trigger when changes are pushed directly to 'main'
  pull_request:
    branches:
      - main # Trigger when a pull request is merged into 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the vue-portfolio-public repository
      - name: Checkout vue-portfolio-public
        uses: actions/checkout@v2

      # Set up Node.js for the build process
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "16"

      # Install dependencies for vue-portfolio (fetch from vue-portfolio)
      - name: Install dependencies
        run: npm install

      # Build the project in vue-portfolio to generate the dist folder
      - name: Build the project
        run: npm run build
        working-directory: ./vue-portfolio # Change working directory to vue-portfolio to run build

      # Checkout the vue-portfolio repository to fetch the dist folder
      - name: Checkout vue-portfolio repo
        uses: actions/checkout@v2
        with:
          repository: aftongauntlett/vue-portfolio
          token: ${{ secrets.GITHUB_TOKEN }}

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@4.1.0
        with:
          branch: gh-pages # Deploy to the gh-pages branch
          folder: vue-portfolio/dist # Deploy from the dist folder in vue-portfolio
          token: ${{ secrets.GITHUB_TOKEN }}
